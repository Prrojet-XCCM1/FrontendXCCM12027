name: Frontend CI/CD

on:
  push:
    branches: ["main"]


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/xccm-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: |
          npm ci
      - name: Run Lint/Build check
        run: |
          # npm run lint
          npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.xccm.example.com # Dummy for build check

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        id: lower
        run: |
          OWNER_LOWER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$OWNER_LOWER/xccm-frontend" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.lower.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            OWNER_LOWER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')
            IMAGE_FULL="ghcr.io/$OWNER_LOWER/xccm-frontend:latest"
            
            cd ${{ secrets.DEPLOY_PATH || '~/xccm' }}/FrontendXCCM12027
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull and restart the specific service
            DOCKER_IMAGE=$IMAGE_FULL docker compose -f docker-compose.prod.yml pull
            DOCKER_IMAGE=$IMAGE_FULL docker compose -f docker-compose.prod.yml up -d
            
            docker image prune -f
