version: "3.8"

services:
  frontend:
    image: ${DOCKER_IMAGE}
    container_name: xccm-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://${VPS_IP}/api
      NEXT_PUBLIC_IA_URL: http://${VPS_IP}/ia
    networks:
      - xccm-network
    restart: always

  nginx:
    image: nginx:alpine
    container_name: xccm-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
    networks:
      - xccm-network
    restart: always

networks:
  xccm-network:
    external: true
